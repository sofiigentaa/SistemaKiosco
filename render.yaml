# API Node y PostgreSQL privado en Render. Render → New → Blueprint → este repo.
services:
  - type: web
    name: sistema-kiosco
    runtime: node
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeploy: true
    pullRequestPreviewsEnabled: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_BRAND
        value: ""
