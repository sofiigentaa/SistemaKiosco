# Despliegue en Render como sitio estático (gratis). Datos, login y tiempo real
# viven en Supabase. Render → New → Blueprint → elegir este repo.
services:
  - type: web
    name: sistema-kiosco
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
      # La cámara se usa para escanear códigos de barras.
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=()
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Supabase → Project Settings → API. La clave "anon" es pública por
      # diseño; lo que protege los datos es el login + RLS (supabase/schema.sql).
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_BRAND
        value: ""
